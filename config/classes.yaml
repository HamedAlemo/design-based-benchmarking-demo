# Harmonized classes and crosswalks. See docs/PROTOCOL.md section 2 and 3.
# Code 0 is reserved for "no prediction" in model maps (nodata, cloud, snow). It always counts as wrong.

harmonized:
  1: water
  2: tree_canopy
  3: low_vegetation
  4: barren
  5: impervious

reference:
  product: "Chesapeake Bay Land Use/Land Cover Database 2024 Edition, land cover (LC) layer, 2021/22"
  doi: "10.5066/P14BEBRC"
  # Match by CLASS NAME from the product's data dictionary or raster attribute table, never by assumed code.
  # M1 fills `observed_codes` from the data and fails (human gate) if any observed name is not listed below.
  name_to_harmonized:
    "Water": 1
    "Emergent Wetlands": 3
    "Tree Canopy": 2
    "Scrub/Shrub": 3
    "Low Vegetation": 3
    "Barren": 4
    "Impervious Structures": 5
    "Other Impervious": 5
    "Impervious Roads": 5
    "Tree Canopy over Impervious Structures": 2
    "Tree Canopy over Other Impervious": 2
    "Tree Canopy over Impervious Roads": 2
    "Shrubland": 3   # 2024-edition name of Scrub/Shrub; approved by the PI 2026-11-15 (DECISIONS.md)
  # Names that may appear with slightly different wording. M1 may normalize case, punctuation and "Surfaces"
  # suffixes, and must log every normalization in docs/DECISIONS.md.
  allow_name_normalization: true
  # If the release has no separate LC raster, M1 derives the 5 classes from the LULC raster using the data
  # dictionary's land cover parent of each LULC class, writes the full mapping here under `lulc_to_harmonized`,
  # and records the decision. This is a human gate only if any LULC class has no clear land cover parent.
  lulc_to_harmonized:   # filled by M1 from lulc_visualization_crosswalk-2024-edition.csv (lc column); see DECISIONS.md
    # code: [harmonized, "LULC name", "LC parent"]
    10: [1, "Tidal Waters", "Water"]
    11: [1, "Lakes and Reservoirs", "Water"]
    12: [1, "Riverine Ponds", "Water"]
    13: [1, "Terrene Ponds", "Water"]
    14: [1, "Streams and Rivers", "Water"]
    15: [4, "Bare Shore", "Barren"]
    20: [5, "Roads", "Impervious Roads"]
    21: [5, "Structures", "Impervious Structures"]
    22: [5, "Other Impervious", "Other Impervious"]
    23: [2, "Tree Canopy Over Roads", "Tree Canopy Over Impervious Roads"]
    24: [2, "Tree Canopy Over Structures", "Tree Canopy Over Impervious Structures"]
    25: [2, "Tree Canopy Over Other Impervious", "Tree Canopy Over Other Impervious"]
    26: [2, "Tree Canopy Over Turf Grass", "Tree Canopy"]
    27: [3, "Turf Grass", "Low Vegetation"]
    28: [4, "Bare Developed", "Barren"]
    30: [4, "Extractive Barren", "Barren"]
    31: [5, "Extractive Impervious", "Other Impervious"]
    32: [5, "Solar Field Panel Arrays", "Other Impervious"]
    33: [4, "Solar Field Barren", "Barren"]
    34: [3, "Solar Field Herbaceous", "Low Vegetation"]
    35: [3, "Solar Field Shrubland", "Shrubland"]
    36: [4, "Suspended Succession Barren", "Barren"]
    37: [3, "Suspended Succession Herbaceous", "Low Vegetation"]
    38: [3, "Suspended Succession Shrubland", "Shrubland"]
    40: [2, "Forest", "Tree Canopy"]
